[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dealscreen"
version = "0.1.0"
description = "Agentic deal screening and first-pass due diligence for private-markets investors: Companies House + web evidence, Claude tool-use, thesis scoring, cited memos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahyan Adatia" }]
keywords = ["private-equity", "due-diligence", "llm-agents", "anthropic", "companies-house"]
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "selectolax>=1.0",
    "markdown>=3.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-Markdown>=3.6",
]

[project.scripts]
dealscreen = "dealscreen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dealscreen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.vercel]
entrypoint = "api.index:app"

